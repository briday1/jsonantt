name: Deploy studio to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "jsonantt/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static studio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Bundle studio and shared Python renderer
        run: python jsonantt/static_site.py --output _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload studio assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
